name: Update weather data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: weather-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch official weather data
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}
        run: python scripts/fetch_weather.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No weather-data changes to commit."
          else
            git commit -m "Update weather dashboard data"
            git push
          fi
