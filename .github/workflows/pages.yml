name: Update and deploy weather dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Primary and fallback slots, avoiding the top of the hour.
    - cron: "7,22,37,52 * * * *"
    - cron: "14,29,44,59 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weather-dashboard-pages
  # Do not interrupt a deploy already transferring the current artifact.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}

    env:
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}
      WEATHERCOM_API_KEY: ${{ secrets.WEATHERCOM_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Decide whether to publish
        id: plan
        shell: bash
        env:
          CRON_TRIGGER: ${{ github.event.schedule }}
        run: |
          publish=true
          if [[ "$CRON_TRIGGER" == "14,29,44,59 * * * *" ]]; then
            if python3 scripts/check_published_freshness.py --max-age-minutes 18; then
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify API secrets
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          if [ -n "$AIRNOW_API_KEY" ]; then
            echo "AIRNOW_API_KEY is available."
          else
            echo "::warning::AIRNOW_API_KEY is not available."
          fi

          if [ -n "$CIMIS_APP_KEY" ]; then
            echo "CIMIS_APP_KEY is available."
          else
            echo "::warning::CIMIS_APP_KEY is not available."
          fi

          if [ -n "$WEATHERCOM_API_KEY" ]; then
            echo "WEATHERCOM_API_KEY is available for unofficial PWS observations."
          else
            echo "::notice::WEATHERCOM_API_KEY is not configured; unofficial PWS readings will be shown as unavailable."
          fi

      - name: Fetch current weather data
        if: steps.plan.outputs.publish == 'true'
        run: python scripts/fetch_weather_v4.py

      - name: Verify dashboard data
        if: steps.plan.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/latest.json")
          if not path.exists():
              raise SystemExit("data/latest.json was not created")

          data = json.loads(path.read_text(encoding="utf-8"))
          print("Generated:", data.get("generated_at"))
          print("Alerts:", len(data.get("alerts", [])))
          print("AQI:", data.get("summary", {}).get("aqi"))
          print("Unofficial PWS:", data.get("unofficial_status"))
          print("Feed messages:", data.get("errors", []))
          print("Station status:")
          for station in data.get("stations", []):
              print(
                  " -",
                  station.get("id"),
                  station.get("network"),
                  "stale=" + str(station.get("stale")),
                  "observed=" + str(station.get("observed_at")),
                  "temp=" + str(station.get("temperature_f")),
                  "humidity=" + str(station.get("relative_humidity_pct")),
              )
          PY

      - name: Configure GitHub Pages
        if: steps.plan.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4