name: Update and deploy weather dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weather-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify API secrets
        shell: bash
        run: |
          if [ -n "$AIRNOW_API_KEY" ]; then
            echo "AIRNOW_API_KEY is available."
          else
            echo "::warning::AIRNOW_API_KEY is not available."
          fi

          if [ -n "$CIMIS_APP_KEY" ]; then
            echo "CIMIS_APP_KEY is available."
          else
            echo "::warning::CIMIS_APP_KEY is not available."
          fi

      - name: Fetch current weather data
        run: python scripts/fetch_weather_v2.py

      - name: Verify dashboard data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/latest.json")
          if not path.exists():
              raise SystemExit("data/latest.json was not created")

          data = json.loads(path.read_text(encoding="utf-8"))
          print("Generated:", data.get("generated_at"))
          print("Stations:", len(data.get("stations", [])))
          print("Alerts:", len(data.get("alerts", [])))
          print("AQI:", data.get("summary", {}).get("aqi"))
          print("Feed messages:", data.get("errors", []))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
