name: Update and deploy weather dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: weather-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch current weather data
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}
        run: python scripts/fetch_weather.py

      - name: Verify live data file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/latest.json")

          if not path.exists():
              raise SystemExit("data/latest.json was not created")

          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("sample") is not False:
              raise SystemExit("The dashboard data is still marked as sample data")

          print("Live weather file created successfully")
          print("Generated:", data.get("generated_at"))
          print("Stations:", len(data.get("stations", [])))
          print("Alerts:", len(data.get("alerts", [])))
          print("Feed warnings:", data.get("errors", []))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
